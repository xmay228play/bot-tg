<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Массажный салон</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0c29;color:#fff;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center;padding:16px;min-height:100vh}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);z-index:-1}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px 20px;width:100%;max-width:420px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);animation:cardIn .6s cubic-bezier(.16,1,.3,1);position:relative}
@keyframes cardIn{from{opacity:0;transform:translateY(40px)scale(.96)}}
h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:rgba(255,255,255,.6);font-size:14px;margin-bottom:24px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s ease;margin-bottom:12px;text-align:center}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.1)}
.btn-small{padding:10px 16px;font-size:13px;display:inline-block;width:auto;margin:4px}
.service-card{background:rgba(255,255,255,.05);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all .3s;border:1px solid transparent}
.service-card:active{transform:scale(.98);border-color:rgba(102,126,234,.5)}
.service-card h3{font-size:16px;margin-bottom:4px}
.service-card p{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:6px}
.service-card .price{font-size:18px;font-weight:700;color:#667eea}
.back{background:none;border:none;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;padding:8px 0;margin-bottom:16px;display:block}
.back:hover{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:16px}
.day-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.7);font-size:12px}
.day-btn.selected{border-color:#667eea;background:rgba(102,126,234,.2);color:#fff}
.time-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center;cursor:pointer;transition:all .2s;font-size:13px;margin:0 0 0 0}
.time-btn.selected{border-color:#667eea;background:rgba(102,126,234,.2);color:#fff}
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-10px)rotate(0deg);opacity:1}100%{transform:translateY(100vh)rotate(720deg);opacity:0}}
.hidden{display:none!important}
.success-icon{font-size:60px;text-align:center;margin:20px 0}
.success-text{text-align:center;font-size:18px;margin-bottom:20px;color:rgba(255,255,255,.8)}
.wheel-container{position:relative;width:280px;height:280px;margin:0 auto 20px}
#wheelCanvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 40px rgba(102,126,234,.3)}
.wheel-pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:25px solid #667eea;z-index:10;filter:drop-shadow(0 2px 8px rgba(102,126,234,.5))}
.wheel-btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:18px;font-weight:700;cursor:pointer;transition:all .3s;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin-bottom:10px}
.wheel-btn:disabled{opacity:.5;cursor:not-allowed}
.wheel-btn:active:not(:disabled){transform:scale(.97)}
.prize-result{text-align:center;padding:20px;animation:cardIn .5s}
.prize-name{font-size:22px;font-weight:700;margin-bottom:8px}
.prize-desc{color:rgba(255,255,255,.6);font-size:14px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glass" id="app">
  <div id="page-menu">
    <h1>✨ Массажный салон</h1>
    <p class="sub">Расслабление и забота о тебе</p>
    <button class="btn btn-primary" onclick="goTo('services')">📅 Записаться</button>
    <button class="btn btn-secondary" onclick="goTo('wheel')">🎡 Колесо фортуны</button>
    <button class="btn btn-secondary" onclick="goTo('profile')">👤 Мои записи</button>
    <p style="text-align:center;color:rgba(255,255,255,.3);font-size:12px;margin-top:20px" id="userInfo"></p>
  </div>

  <div id="page-services" class="hidden">
    <button class="back" onclick="goTo('menu')">← Назад</button>
    <h1>📅 Услуги</h1>
    <p class="sub">Выбери, что тебе подходит</p>
    <div id="servicesList"></div>
  </div>

  <div id="page-booking" class="hidden">
    <button class="back" onclick="goTo('services')">← Назад</button>
    <h1 id="bookingTitle">Запись</h1>
    <p class="sub">Выбери дату и время</p>
    <div id="dateGrid" class="grid"></div>
    <div id="timeGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px"></div>
    <button class="btn btn-primary hidden" id="confirmBtn" onclick="confirmBooking()">✅ Подтвердить запись</button>
  </div>

  <div id="page-success" class="hidden">
    <div class="success-icon">✅</div>
    <div class="success-text" id="successText">Запись подтверждена!</div>
    <button class="btn btn-primary" onclick="goTo('menu')">← В меню</button>
  </div>

  <div id="page-wheel" class="hidden">
    <button class="back" onclick="goTo('menu')">← Назад</button>
    <h1>🎡 Колесо фортуны</h1>
    <p class="sub">Крути раз в день и выигрывай</p>
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas" width="560" height="560"></canvas>
    </div>
    <button class="wheel-btn" id="spinBtn" onclick="spinWheel()">🎡 Крутить!</button>
    <p id="spinTimer" style="text-align:center;color:rgba(255,255,255,.4);font-size:13px"></p>
    <div id="prizeResult" class="hidden"></div>
  </div>

  <div id="page-profile" class="hidden">
    <button class="back" onclick="goTo('menu')">← Назад</button>
    <h1>👤 Мои записи</h1>
    <p class="sub">История посещений</p>
    <div id="appointmentsList"></div>
    <p style="text-align:center;color:rgba(255,255,255,.3);font-size:13px;margin-top:16px" id="statsInfo"></p>
  </div>
</div>

<script>
// ============= Telegram WebApp =============
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

// ============= ПАРСИНГ ХЭША =============
// Поддерживаем: #book-1, #wheel, #menu, #services, #profile
function parseHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) return { action: 'menu' };
  
  // #book-1 → book с service_id = 1
  const bookMatch = hash.match(/^book-(\d+)$/);
  if (bookMatch) return { action: 'book', service_id: parseInt(bookMatch[1]) };

  return { action: hash };
}

// ============= РОУТИНГ =============
let appState = { tg_id: tg?.initDataUnsafe?.user?.id || null, service_id: null, selectedDate: null, selectedTime: null };

function showPage(id) {
  document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
  document.getElementById('page-' + id).classList.remove('hidden');
}

function goTo(page, data) {
  if (page === 'menu') { window.location.hash = ''; showPage('menu'); return; }
  if (page === 'services') { window.location.hash = ''; showPage('services'); loadServices(); return; }
  if (page === 'wheel') { window.location.hash = 'wheel'; showPage('wheel'); loadWheel(); return; }
  if (page === 'profile') { window.location.hash = ''; showPage('profile'); loadProfile(); return; }
  if (page === 'success') { showPage('success'); return; }
}

// Обрабатываем хэш при загрузке и изменении
function handleHash() {
  const params = parseHash();
  if (params.action === 'book') {
    appState.service_id = params.service_id;
    showPage('booking');
    loadBooking(params.service_id);
  } else if (params.action === 'wheel') {
    showPage('wheel');
    loadWheel();
  } else {
    // menu или пустой
    if (params.action !== 'menu') {
      window.location.hash = '';
    }
    showPage('menu');
    loadMenu();
  }
}

window.addEventListener('hashchange', handleHash);
window.addEventListener('load', handleHash);

// ============= API =============
const API = window.location.origin;

function getData() {
  const initData = tg?.initData || '';
  return {
    init_data: initData,
    data: initData ? {} : { telegram_id: 123456 } // fallback для теста
  };
}

async function apiPost(endpoint, extra = {}) {
  const res = await fetch(`${API}${endpoint}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({...getData(), ...extra})
  });
  return res.json();
}

async function apiGet(endpoint) {
  const res = await fetch(`${API}${endpoint}`);
  return res.json();
}

// ============= МЕНЮ =============
async function loadMenu() {
  if (tg?.initDataUnsafe?.user) {
    document.getElementById('userInfo').textContent = '👤 ' + (tg.initDataUnsafe.user.first_name || '');
  }
}

// ============= УСЛУГИ =============
async function loadServices() {
  const data = await apiGet('/api/services');
  const list = document.getElementById('servicesList');
  list.innerHTML = '';
  (data.services || []).forEach(s => {
    list.innerHTML += `
      <div class="service-card" onclick="selectService(${s.id})">
        <h3>${s.name}</h3>
        <p>${s.description || ''} · ${s.duration} мин</p>
        <span class="price">${s.price} ₽</span>
      </div>
    `;
  });
}

function selectService(id) {
  appState.service_id = id;
  showPage('booking');
  loadBooking(id);
}

// ============= БРОНИРОВАНИЕ =============
async function loadBooking(serviceId) {
  document.getElementById('bookingTitle').textContent = '📅 Запись';
  appState.selectedDate = null;
  appState.selectedTime = null;
  document.getElementById('confirmBtn').classList.add('hidden');

  // Даты (следующие 7 дней)
  const grid = document.getElementById('dateGrid');
  grid.innerHTML = '';
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const label = days[d.getDay()] + ' ' + d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0');
    const isToday = i === 0;
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (isToday ? ' selected' : '');
    btn.textContent = label;
    btn.dataset.date = d.toISOString().split('T')[0];
    btn.onclick = () => selectDate(btn);
    if (isToday) appState.selectedDate = btn.dataset.date;
    grid.appendChild(btn);
  }
  
  if (appState.selectedDate) loadTimes(appState.selectedDate);
}

function selectDate(el) {
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  appState.selectedDate = el.dataset.date;
  loadTimes(appState.selectedDate);
}

function loadTimes(date) {
  const container = document.getElementById('timeGrid');
  container.innerHTML = '';
  appState.selectedTime = null;
  document.getElementById('confirmBtn').classList.add('hidden');

  const times = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
  times.forEach(t => {
    const btn = document.createElement('div');
    btn.className = 'time-btn';
    btn.textContent = t;
    btn.dataset.time = t;
    btn.onclick = () => {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      appState.selectedTime = t;
      document.getElementById('confirmBtn').classList.remove('hidden');
    };
    container.appendChild(btn);
  });
}

async function confirmBooking() {
  if (!appState.service_id || !appState.selectedDate || !appState.selectedTime) return;
  document.getElementById('confirmBtn').textContent = '⏳ Подождите...';
  document.getElementById('confirmBtn').disabled = true;
  
  const result = await apiPost('/api/book', {
    data: { service_id: appState.service_id, date: appState.selectedDate, time: appState.selectedTime }
  });
  
  if (result.success) {
    document.getElementById('successText').textContent = '✅ Запись подтверждена!\n' + appState.selectedDate + ' в ' + appState.selectedTime;
    showPage('success');
  } else {
    alert('Ошибка: ' + (result.detail || 'Попробуйте другое время'));
  }
  
  document.getElementById('confirmBtn').textContent = '✅ Подтвердить запись';
  document.getElementById('confirmBtn').disabled = false;
}

// ============= КОЛЕСО ФОРТУНЫ =============
let wheelAngle = 0;
let isSpinning = false;
let currentPrizes = [];

function drawWheel(prizes, angle = 0) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const n = prizes.length;
  const arc = (2 * Math.PI) / n;
  
  ctx.clearRect(0, 0, 560, 560);
  
  prizes.forEach((p, i) => {
    const startAngle = angle + i * arc;
    const endAngle = startAngle + arc;
    
    ctx.beginPath();
    ctx.moveTo(280, 280);
    ctx.arc(280, 280, 260, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Текст
    ctx.save();
    ctx.translate(280, 280);
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(p.name, 240, 6);
    ctx.restore();
  });
  
  // Центральный круг
  ctx.beginPath();
  ctx.arc(280, 280, 30, 0, 2 * Math.PI);
  ctx.fillStyle = '#0f0c29';
  ctx.fill();
  ctx.strokeStyle = '#667eea';
  ctx.lineWidth = 3;
  ctx.stroke();
}

async function loadWheel() {
  document.getElementById('prizeResult').classList.add('hidden');
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinBtn').textContent = '⏳ Загрузка...';
  
  const data = await apiGet('/api/services');
  // Призовые цвета
  const prizeColors = [
    { name: '10% скидка', color: '#FF6B6B' },
    { name: '20% скидка', color: '#4ECDC4' },
    { name: 'Консультация', color: '#45B7D1' },
    { name: '+15 минут', color: '#96CEB4' },
    { name: 'Попробуй', color: '#DDA0DD' },
    { name: '50% скидка', color: '#FFD700' }
  ];
  
  currentPrizes = prizeColors;
  drawWheel(prizeColors, 0);
  
  const spinData = await apiPost('/api/can-spin');
  if (spinData.can_spin) {
    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinBtn').textContent = '🎡 Крутить!';
    document.getElementById('spinTimer').textContent = 'Сегодня ещё не крутил(а)';
  } else {
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('spinBtn').textContent = '⏳ Завтра';
    const hours = Math.floor(spinData.remaining / 3600);
    const mins = Math.floor((spinData.remaining % 3600) / 60);
    document.getElementById('spinTimer').textContent = `Следующий раз через ${hours}ч ${mins}м`;
  }
}

async function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  
  const spinData = await apiPost('/api/spin');
  
  if (spinData.prize) {
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('spinBtn').textContent = '🎡...';
    
    const prizeIndex = currentPrizes.findIndex(p => p.name.toLowerCase().includes(spinData.prize.name.slice(0, 5).toLowerCase()));
    const targetAngle = 5 * 360 + (360 / currentPrizes.length) * (prizeIndex >= 0 ? prizeIndex : 0);
    wheelAngle += targetAngle;
    
    drawWheel(currentPrizes, wheelAngle * Math.PI / 180);
    
    // Показываем результат
    setTimeout(() => {
      document.getElementById('prizeResult').classList.remove('hidden');
      document.getElementById('prizeResult').innerHTML = `
        <div class="prize-result">
          <div style="font-size:50px;margin-bottom:10px">🎉</div>
          <div class="prize-name" style="color:${spinData.prize.color}">${spinData.prize.name}</div>
          <div class="prize-desc">${spinData.prize.description}</div>
        </div>
      `;
      document.getElementById('spinBtn').textContent = '⏳ Завтра';
      loadWheel();
    }, 800);
  }
  
  isSpinning = false;
}

// ============= ПРОФИЛЬ =============
async function loadProfile() {
  const list = document.getElementById('appointmentsList');
  const stats = document.getElementById('statsInfo');
  list.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,.4)">⏳ Загрузка...</p>';
  
  const data = await apiPost('/api/user');
  
  list.innerHTML = '';
  if (data.appointments && data.appointments.length > 0) {
    data.appointments.forEach(a => {
      list.innerHTML += `
        <div class="service-card" style="cursor:default">
          <h3>${a.service}</h3>
          <p>📅 ${a.date} в ${a.time} · Статус: ${a.status === 'confirmed' ? '✅' : '❌'}</p>
        </div>
      `;
    });
  } else {
    list.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,.4)">📭 Нет записей</p>';
  }
  
  if (data.stats) {
    stats.textContent = `📅 Записей: ${data.stats.appointments || 0} · 🎡 Крутил(а): ${data.stats.spins || 0} раз(а)`;
  }
}

// Если нет хэша при загрузке — показываем меню
if (!window.location.hash) {
  document.addEventListener('DOMContentLoaded', () => goTo('menu'));
}
</script>
</body>
</html>
