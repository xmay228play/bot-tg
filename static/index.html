<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Массажный салон</title>
<style>
/* ============= СБРОС И БАЗА ============= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: #0f0c29;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  color: #fff;
  overflow-x: hidden;
  position: relative;
}

/* Фон с анимированными частицами */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  z-index: -1;
}
.particles {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  z-index: -1;
  pointer-events: none;
}
.particle {
  position: absolute;
  width: 6px; height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
}

/* Анимированный градиент-бэкграунд */
.gradient-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  animation: orbMove 8s ease-in-out infinite alternate;
  z-index: -1;
  pointer-events: none;
}
.orb1 {
  width: 400px; height: 400px;
  background: #667eea;
  top: -100px; right: -100px;
  animation-delay: 0s;
}
.orb2 {
  width: 350px; height: 350px;
  background: #764ba2;
  bottom: -80px; left: -80px;
  animation-delay: -4s;
}
@keyframes orbMove {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, 30px) scale(1.1); }
}

/* ============= КАРТОЧКА ============= */
.glass {
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 28px;
  padding: 28px 20px;
  width: 100%;
  max-width: 420px;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
  animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.glass::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ============= ТИПОГРАФИКА ============= */
h1 {
  font-size: 28px; font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
h2 {
  font-size: 20px; font-weight: 700;
  margin-bottom: 16px;
  opacity: 0.95;
  letter-spacing: -0.3px;
}
p {
  font-size: 14px; line-height: 1.7;
  opacity: 0.7;
  margin-bottom: 12px;
}

/* ============= АНИМАЦИИ ============= */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px rgba(102,126,234,0.2); }
  50% { box-shadow: 0 0 40px rgba(102,126,234,0.4); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes bounceIn {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes confettiFall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
@keyframes ripple {
  0% { transform: scale(0); opacity: 0.5; }
  100% { transform: scale(4); opacity: 0; }
}
@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(102,126,234,0.3)); }
  50% { filter: drop-shadow(0 0 20px rgba(102,126,234,0.6)); }
}

/* ============= КНОПКИ ============= */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  color: #fff;
  margin-bottom: 10px;
  text-decoration: none;
  overflow: hidden;
  letter-spacing: 0.3px;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn:hover::after { opacity: 1; }
.btn:hover { transform: translateY(-3px); }
.btn:active { transform: translateY(-1px) scale(0.98); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
}
.btn-success {
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  box-shadow: 0 8px 25px rgba(56, 239, 125, 0.3);
}
.btn-danger {
  background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
  box-shadow: 0 8px 25px rgba(235, 51, 73, 0.3);
}
.btn-warning {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
}
.btn-outline {
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.85);
}
.btn-outline:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

/* Скелетон-загрузка */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: 12px;
  margin-bottom: 10px;
}
.skeleton-line { height: 16px; width: 100%; }
.skeleton-line.w60 { width: 60%; }
.skeleton-line.w40 { width: 40%; }
.skeleton-card { height: 80px; }

/* ============= ХЕДЕР ============= */
.header {
  text-align: center;
  margin-bottom: 28px;
}
.logo {
  width: 80px; height: 80px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin: 0 auto 16px;
  box-shadow: 0 12px 40px rgba(102, 126, 234, 0.4);
  position: relative;
  animation: glowPulse 3s ease-in-out infinite;
}
.logo::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 25px;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
  z-index: -1;
  opacity: 0.5;
  filter: blur(10px);
}
.subtitle {
  font-size: 14px;
  opacity: 0.5;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* ============= ТОП-БАР ============= */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.top-bar h2 { margin-bottom: 0; }
.close-btn {
  width: 38px; height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  border: 1px solid rgba(255,255,255,0.06);
}
.close-btn:hover { background: rgba(255,255,255,0.12); transform: rotate(90deg); }

/* ============= УСЛУГИ ============= */
.service-card {
  background: rgba(255,255,255,0.04);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.service-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, #667eea, #764ba2);
  opacity: 0;
  transition: opacity 0.3s;
}
.service-card:hover {
  background: rgba(255,255,255,0.08);
  transform: translateX(6px);
  border-color: rgba(255,255,255,0.12);
}
.service-card:hover::before { opacity: 1; }
.service-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.service-meta { font-size: 13px; opacity: 0.5; }
.service-price {
  font-size: 20px;
  font-weight: 800;
  margin-top: 8px;
  background: linear-gradient(135deg, #38ef7d, #11998e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.service-duration {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  opacity: 0.5;
  margin-top: 2px;
}

/* ============= ФОРМЫ ============= */
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  opacity: 0.7;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-size: 11px;
}
input, select {
  width: 100%;
  padding: 16px 18px;
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  font-size: 15px;
  background: rgba(255,255,255,0.04);
  color: #fff;
  outline: none;
  transition: all 0.3s;
}
input::placeholder { color: rgba(255,255,255,0.25); }
input:focus, select:focus {
  border-color: rgba(102,126,234,0.5);
  background: rgba(255,255,255,0.07);
  box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
select option { background: #1a1a3e; color: #fff; }

/* ============= ДАТЫ И ВРЕМЯ ============= */
.time-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.time-btn {
  padding: 12px 6px;
  border: 1.5px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: center;
}
.time-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-2px);
}
.time-btn.selected {
  background: rgba(56, 239, 125, 0.15);
  border-color: #38ef7d;
  color: #38ef7d;
  box-shadow: 0 4px 15px rgba(56, 239, 125, 0.15);
}
.time-btn:disabled { opacity: 0.15; cursor: not-allowed; transform: none; }

/* ============= КОЛЕСО ФОРТУНЫ ============= */
.wheel-container {
  position: relative;
  width: 290px;
  height: 290px;
  margin: 0 auto 20px;
}
.wheel-canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  filter: drop-shadow(0 0 30px rgba(102,126,234,0.2));
  animation: glowPulse 4s ease-in-out infinite;
}
.wheel-pointer {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 36px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
  z-index: 10;
  color: #FFD700;
  animation: bounceIn 0.5s ease;
}
.spin-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 25px rgba(102,126,234,0.4);
  transition: all 0.3s;
  z-index: 5;
  letter-spacing: 0.5px;
  line-height: 1.2;
}
.spin-btn:hover {
  transform: translate(-50%, -50%) scale(1.08);
  box-shadow: 0 6px 35px rgba(102,126,234,0.5);
}
.spin-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: translate(-50%, -50%) scale(1); }

/* ============= РЕЗУЛЬТАТ ============= */
.result-box {
  text-align: center;
  padding: 24px;
  background: rgba(255,255,255,0.04);
  border-radius: 20px;
  margin-top: 16px;
  border: 1px solid rgba(255,255,255,0.08);
  animation: bounceIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.result-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.result-subtitle {
  font-size: 14px;
  opacity: 0.6;
}
.timer {
  font-size: 13px;
  opacity: 0.5;
  margin-top: 12px;
  font-family: 'SF Mono', 'Fira Code', monospace;
}

/* ============= ЗАПИСИ ============= */
.appointment-item {
  background: rgba(255,255,255,0.04);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 8px;
  border-left: 4px solid #38ef7d;
  animation: slideUp 0.4s ease;
  transition: all 0.3s;
}
.appointment-item:hover { background: rgba(255,255,255,0.07); }
.appointment-item.cancelled { border-left-color: #eb3349; opacity: 0.4; }
.appointment-service { font-size: 15px; font-weight: 600; }
.appointment-date { font-size: 13px; opacity: 0.5; margin-top: 4px; }
.appointment-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-top: 6px;
  background: rgba(56,239,125,0.1);
  color: #38ef7d;
}
.appointment-item.cancelled .appointment-status {
  background: rgba(235,51,73,0.1);
  color: #eb3349;
}

/* ============= СТАТИСТИКА ============= */
.stat-cards {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.stat-card {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.3s;
}
.stat-card:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
.stat-number {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label { font-size: 11px; opacity: 0.4; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ============= НАВИГАЦИЯ ============= */
.nav {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}
.nav-btn {
  flex: 1;
  padding: 12px 10px;
  border: none;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.6);
  border: 1px solid transparent;
}
.nav-btn:hover { background: rgba(255,255,255,0.08); }
.nav-btn.active {
  background: rgba(102,126,234,0.15);
  border-color: rgba(102,126,234,0.3);
  color: #fff;
}

/* ============= СКРОЛЛ ============= */
.scroll-area {
  max-height: 500px;
  overflow-y: auto;
  padding-right: 6px;
}
.scroll-area::-webkit-scrollbar { width: 3px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

/* ============= ЗАГРУЗКА ============= */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 0;
  gap: 6px;
}
.loading-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  animation: dotBounce 1.4s ease-in-out infinite;
}
.loading-dot:nth-child(1) { animation-delay: 0s; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; background: rgba(102,126,234,0.6); }
}

/* ============= КОНФЕТТИ ============= */
.confetti-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  top: -10px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ============= АДАПТАЦИЯ ============= */
@media (max-width: 480px) {
  .glass { padding: 20px 14px; border-radius: 22px; }
  h1 { font-size: 24px; }
  .wheel-container { width: 250px; height: 250px; }
  .time-grid { grid-template-columns: repeat(3, 1fr); }
  .stat-cards { gap: 8px; }
  .stat-card { padding: 12px 8px; }
  .stat-number { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Фоновые частицы -->
<div class="particles" id="particles"></div>
<div class="gradient-orb orb1"></div>
<div class="gradient-orb orb2"></div>
<div class="confetti-container" id="confettiContainer"></div>

<div class="glass" id="app">
  <!-- Будет заполняться JavaScript -->
</div>

<script>
// ============= ЧАСТИЦЫ =============
(function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = p.style.height = (2 + Math.random() * 6) + 'px';
    p.style.animationDuration = (10 + Math.random() * 20) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(p);
  }
})();

// ============= КОНФЕТТИ =============
function fireConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#667eea', '#764ba2', '#f093fb', '#38ef7d', '#FFD700', '#ff6b6b', '#4ECDC4'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (5 + Math.random() * 10) + 'px';
    piece.style.height = (5 + Math.random() * 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

// ============= НАСТРОЙКИ =============
const WEBAPP_URL = window.location.origin;
const API_URL = WEBAPP_URL;

function getParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    action: params.get('action') || 'menu',
    service_id: params.get('service_id') || null,
    tg_id: params.get('tg_id') || null
  };
}

function getTelegramInitData() {
  if (window.Telegram && window.Telegram.WebApp) {
    return window.Telegram.WebApp.initData;
  }
  const params = new URLSearchParams(window.location.search);
  return params.get('tg_init') || '';
}

async function apiCall(endpoint, data) {
  const initData = getTelegramInitData();
  try {
    const resp = await fetch(`${API_URL}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data, init_data: initData })
    });
    return await resp.json();
  } catch (e) {
    console.error('API Error:', e);
    return { error: 'Ошибка соединения' };
  }
}

// ============= ПРИЛОЖЕНИЕ =============
const App = {
  el: document.getElementById('app'),
  params: getParams(),

  async init() {
    if (this.params.action === 'book' && this.params.service_id) {
      this.renderDateTime(this.params.service_id);
    } else if (this.params.action === 'wheel') {
      this.renderWheel();
    } else {
      this.renderMenu();
    }
  },

  setContent(html) {
    this.el.style.opacity = '0';
    this.el.style.transform = 'scale(0.97)';
    setTimeout(() => {
      this.el.innerHTML = html;
      this.el.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
      this.el.style.opacity = '1';
      this.el.style.transform = 'scale(1)';
    }, 80);
  },

  renderMenu() {
    this.setContent(`
      <div class="header">
        <div class="logo">💆</div>
        <h1>Массажный салон</h1>
        <div class="subtitle">Расслабление и забота о вас</div>
      </div>
      <button class="btn btn-primary" onclick="App.renderServices()">
        <span>📅</span> Записаться на массаж
      </button>
      <button class="btn btn-warning" onclick="App.renderWheel()">
        <span>🎡</span> Колесо фортуны
      </button>
      <button class="btn btn-outline" onclick="App.renderMyAppointments()">
        <span>👤</span> Мои записи
      </button>
      <p style="text-align:center;margin-top:24px;font-size:11px;opacity:0.3;letter-spacing:0.5px;">
        СДЕЛАНО С ❤️ ДЛЯ ВАС
      </p>
    `);
  },

  async renderServices() {
    this.setContent(`
      <div class="top-bar">
        <h2>📅 Услуги</h2>
        <button class="close-btn" onclick="App.renderMenu()">✕</button>
      </div>
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    `);

    const resp = await fetch(`${API_URL}/api/services`);
    const data = await resp.json();
    const services = data.services || [];

    let html = `
      <div class="top-bar">
        <h2>📅 Выберите услугу</h2>
        <button class="close-btn" onclick="App.renderMenu()">✕</button>
      </div>
      <div class="scroll-area">
    `;

    services.forEach((s, i) => {
      html += `
        <div class="service-card" onclick="App.renderDateTime(${s.id})" style="animation:fadeIn 0.4s ease ${i * 0.08}s both;">
          <div class="service-name">${s.name}</div>
          <div class="service-duration">⏱ ${s.duration} мин</div>
          <div class="service-meta">${s.description}</div>
          <div class="service-price">${s.price.toLocaleString()} ₽</div>
        </div>
      `;
    });

    html += `</div>`;
    this.setContent(html);
  },

  async renderDateTime(serviceId) {
    const params = new URLSearchParams(window.location.search);
    const tgId = params.get('tg_id');

    const dates = [];
    const now = new Date();
    for (let i = 0; i < 7; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const day = d.getDate().toString().padStart(2, '0');
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const year = d.getFullYear();
      const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      dates.push({
        value: `${year}-${month}-${day}`,
        label: `${day}.${month} ${dayNames[d.getDay()]}`
      });
    }

    const times = [];
    for (let h = 9; h <= 18; h++) {
      times.push(`${h.toString().padStart(2, '0')}:00`);
      times.push(`${h.toString().padStart(2, '0')}:30`);
    }

    let dateOptions = dates.map(d =>
      `<option value="${d.value}">${d.label}</option>`
    ).join('');

    let timeButtons = times.map(t =>
      `<button class="time-btn" onclick="App.selectTime(this)" data-time="${t}">${t}</button>`
    ).join('');

    this.setContent(`
      <div class="top-bar">
        <h2>📅 Дата и время</h2>
        <button class="close-btn" onclick="App.renderServices()">✕</button>
      </div>
      <div style="margin-bottom:8px;display:flex;gap:6px;opacity:0.4;font-size:11px;">
        <span>📍 Шаг 2 из 3</span>
      </div>
      <div class="form-group">
        <label>Дата</label>
        <select id="dateSelect">${dateOptions}</select>
      </div>
      <div class="form-group">
        <label>Время</label>
        <div class="time-grid">${timeButtons}</div>
      </div>
      <button class="btn btn-success" onclick="App.confirmBooking(${serviceId})" id="bookBtn" disabled>
        ✅ Подтвердить запись
      </button>
      <p id="bookError" style="color:#ff6b6b;font-size:13px;text-align:center;margin-top:8px;"></p>
    `);
  },

  selectedTime: null,
  selectTime(btn) {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    this.selectedTime = btn.dataset.time;
    document.getElementById('bookBtn').disabled = false;
    document.getElementById('bookError').textContent = '';
  },

  async confirmBooking(serviceId) {
    const params = new URLSearchParams(window.location.search);
    const tgId = params.get('tg_id') || '0';
    const date = document.getElementById('dateSelect').value;
    const time = this.selectedTime;

    if (!time) return;

    const btn = document.getElementById('bookBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';

    const result = await apiCall('/api/book', {
      telegram_id: parseInt(tgId),
      service_id: parseInt(serviceId),
      date: date,
      time: time
    });

    if (result.success) {
      fireConfetti();
      this.setContent(`
        <div class="header" style="animation:slideUp 0.5s ease;">
          <div class="logo" style="background:linear-gradient(135deg,#11998e,#38ef7d);font-size:42px;">
            ✨
          </div>
          <h1 style="background:linear-gradient(135deg,#38ef7d,#11998e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
            Запись подтверждена!
          </h1>
          <div style="margin:20px 0;padding:16px;background:rgba(255,255,255,0.04);border-radius:16px;border:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:32px;font-weight:800;margin-bottom:4px;">${date}</div>
            <div style="font-size:20px;opacity:0.7;">${time}</div>
          </div>
          <p style="opacity:0.5;">Ждем вас! Если нужно отменить —<br>напишите в бот.</p>
          <button class="btn btn-primary" onclick="App.renderMenu()" style="margin-top:20px;">
            🏠 На главную
          </button>
        </div>
      `);
    } else {
      document.getElementById('bookError').textContent = result.detail || 'Ошибка при записи';
      btn.disabled = false;
      btn.innerHTML = '✅ Подтвердить запись';
    }
  },

  async renderWheel() {
    const params = new URLSearchParams(window.location.search);
    const tgId = params.get('tg_id') || '0';

    this.setContent(`
      <div class="top-bar">
        <h2>🎡 Колесо фортуны</h2>
        <button class="close-btn" onclick="App.renderMenu()">✕</button>
      </div>
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" class="wheel-canvas" width="580" height="580"></canvas>
        <button class="spin-btn" id="spinBtn" onclick="App.doSpin()">КРУТИТЬ</button>
      </div>
      <div id="wheelResult"></div>
      <div id="wheelTimer" class="timer" style="text-align:center;"></div>
    `);

    this.wheelCtx = document.getElementById('wheelCanvas').getContext('2d');
    this.wheelAngle = 0;
    this.isSpinning = false;

    const result = await apiCall('/api/can-spin', { telegram_id: parseInt(tgId) });

    if (result.can_spin === false) {
      document.getElementById('spinBtn').disabled = true;
      const hours = Math.floor(result.remaining / 3600);
      const mins = Math.floor((result.remaining % 3600) / 60);
      document.getElementById('wheelTimer').textContent = `⏳ Через ${hours}ч ${mins}мин`;
    } else {
      document.getElementById('wheelTimer').textContent = '🎉 Можно крутить!';
    }

    this.prizeColors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#DDA0DD','#FFD700'];
    this.drawWheel(0);
  },

  drawWheel(rotation) {
    const ctx = this.wheelCtx;
    const canvas = ctx.canvas;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 10;
    const slices = this.prizeColors.length;
    const sliceAngle = (2 * Math.PI) / slices;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Тень
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + 4, 0, 2 * Math.PI);
    ctx.shadowColor = 'rgba(102,126,234,0.3)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = 'transparent';
    ctx.fill();
    ctx.restore();

    const prizeNames = ['Скидка 10%', 'Скидка 20%', 'Консультация', '+15 мин', 'Попробуй', '50%!!!'];

    for (let i = 0; i < slices; i++) {
      const startAngle = rotation + i * sliceAngle;
      const endAngle = startAngle + sliceAngle;

      // Градиент для каждого сектора
      const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      grad.addColorStop(0, this.lightenColor(this.prizeColors[i], 30));
      grad.addColorStop(1, this.prizeColors[i]);

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Рамка
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Текст
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;
      ctx.fillText(prizeNames[i], radius - 24, 5);
      ctx.restore();
    }

    // Внешнее свечение
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Центральный круг
    const centerGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 42);
    centerGrad.addColorStop(0, 'rgba(102,126,234,1)');
    centerGrad.addColorStop(1, 'rgba(118,75,162,1)');
    ctx.beginPath();
    ctx.arc(centerX, centerY, 42, 0, 2 * Math.PI);
    ctx.fillStyle = centerGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Блики на центре
    ctx.beginPath();
    ctx.arc(centerX - 8, centerY - 8, 12, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
  },

  lightenColor(color, percent) {
    const num = parseInt(color.replace('#',''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.min(255, (num >> 16) + amt);
    const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
    const B = Math.min(255, (num & 0x0000FF) + amt);
    return `rgb(${R},${G},${B})`;
  },

  async doSpin() {
    if (this.isSpinning) return;
    this.isSpinning = true;

    const params = new URLSearchParams(window.location.search);
    const tgId = params.get('tg_id') || '0';

    const spinBtn = document.getElementById('spinBtn');
    spinBtn.disabled = true;
    spinBtn.textContent = '⏳';

    const result = await apiCall('/api/spin', { telegram_id: parseInt(tgId) });

    if (result.error || !result.prize) {
      document.getElementById('wheelResult').innerHTML = `
        <p style="color:#ff6b6b;text-align:center;">${result.detail || 'Ошибка'}</p>
      `;
      this.isSpinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'КРУТИТЬ';
      return;
    }

    const prizeNames = ['Скидка 10%', 'Скидка 20%', 'Бесплатная консультация', '+15 минут к сеансу', 'Попробуй снова', 'Скидка 50%'];
    let prizeIndex = prizeNames.indexOf(result.prize.name);
    if (prizeIndex === -1) prizeIndex = 0;

    const slices = this.prizeColors.length;
    const sliceAngle = (2 * Math.PI) / slices;
    const targetAngle = (2 * Math.PI) - (prizeIndex * sliceAngle + sliceAngle / 2) + Math.PI / 2;
    const fullSpins = 6 * 2 * Math.PI;
    const totalAngle = fullSpins + targetAngle - (this.wheelAngle % (2 * Math.PI));
    const endAngle = this.wheelAngle + totalAngle;

    const duration = 4000;
    const startTime = Date.now();
    const startAngle = this.wheelAngle;

    const animate = () => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 4);
      const currentAngle = startAngle + (endAngle - startAngle) * eased;

      this.drawWheel(currentAngle);
      this.wheelAngle = currentAngle;

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        this.isSpinning = false;
        spinBtn.disabled = true;
        spinBtn.textContent = '🎉';
        fireConfetti();

        const color = result.prize.color || '#FFD700';
        document.getElementById('wheelResult').innerHTML = `
          <div class="result-box" style="border-color:${color};background:rgba(255,255,255,0.06);">
            <div class="result-title" style="color:${color};text-shadow:0 0 20px ${color}40;">${result.prize.name}</div>
            <div class="result-subtitle">${result.prize.description || 'Отличный приз!'}</div>
            <div style="margin-top:12px;font-size:32px;">
              ${prizeIndex === 5 ? '🏆' : prizeIndex === 0 ? '🍀' : '🎁'}
            </div>
          </div>
        `;
        document.getElementById('wheelTimer').textContent = '🎡 Возвращайтесь завтра!';
      }
    };
    animate();
  },

  async renderMyAppointments() {
    const params = new URLSearchParams(window.location.search);
    const tgId = params.get('tg_id') || '0';

    this.setContent(`
      <div class="top-bar">
        <h2>👤 Мои записи</h2>
        <button class="close-btn" onclick="App.renderMenu()">✕</button>
      </div>
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    `);

    const result = await apiCall('/api/user', { telegram_id: parseInt(tgId) });

    if (result.error) {
      this.setContent(`
        <div class="top-bar">
          <h2>👤 Мои записи</h2>
          <button class="close-btn" onclick="App.renderMenu()">✕</button>
        </div>
        <p style="text-align:center;color:#ff6b6b;padding:20px;">Ошибка загрузки</p>
        <button class="btn btn-primary" onclick="App.renderMenu()">🏠 На главную</button>
      `);
      return;
    }

    const appointments = result.appointments || [];
    const stats = result.stats || { appointments: 0, spins: 0 };

    let html = `
      <div class="top-bar">
        <h2>👤 Мои записи</h2>
        <button class="close-btn" onclick="App.renderMenu()">✕</button>
      </div>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-number">${stats.appointments}</div>
          <div class="stat-label">Записей</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${stats.spins}</div>
          <div class="stat-label">Вращений</div>
        </div>
      </div>
      <div class="scroll-area">
    `;

    if (appointments.length === 0) {
      html += `
        <div style="text-align:center;padding:40px 20px;opacity:0.4;">
          <div style="font-size:48px;margin-bottom:12px;">📭</div>
          <p>Пока нет записей</p>
        </div>
      `;
    } else {
      appointments.forEach(a => {
        const isCancelled = a.status !== 'confirmed';
        html += `
          <div class="appointment-item ${isCancelled ? 'cancelled' : ''}">
            <div class="appointment-service">${a.service}</div>
            <div class="appointment-date">📅 ${a.date} в ${a.time}</div>
            <div class="appointment-status">${a.status === 'confirmed' ? '✅ Подтверждено' : '❌ Отменено'}</div>
          </div>
        `;
      });
    }

    html += `</div><button class="btn btn-primary" onclick="App.renderMenu()" style="margin-top:16px;">🏠 На главную</button>`;
    this.setContent(html);
  }
};

// Запуск
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
